# CloudScope Production Release Compose Configuration
# Runs the application from prebuilt, immutable container images published to GHCR.
#
# Quickstart:
#   1. cp .env.example .env
#   2. Configure secrets in .env (NEO4J_PASSWORD, JWT_SECRET, etc.)
#   3. docker compose -f compose.release.yaml pull
#   4. docker compose -f compose.release.yaml up -d
#
# Access the web UI at: http://localhost

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: cloudscope-neo4j
    networks:
      - cloudscope-internal
    ports:
      - "127.0.0.1:7474:7474" # Neo4j HTTP Console (localhost only for security)
      - "127.0.0.1:7687:7687" # Neo4j Bolt (localhost only for security)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD must be set in .env}"
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudscope-redis
    networks:
      - cloudscope-internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/surendiranj/cloudscope-backend}:${IMAGE_TAG:-sura-latest}
    container_name: cloudscope-backend
    networks:
      cloudscope-internal:
      cloudscope-public:
        aliases:
          - cloudscope-backend
    # Backend port is reachable internally by frontend over cloudscope-public
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - ${AWS_CREDENTIALS_DIR:-~/.aws}:/home/cloudscope/.aws:ro
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      SCAN_REGIONS: ${SCAN_REGIONS:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD must be set in .env}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/cloudscope.db}
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be set in .env}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?Error: OIDC_ISSUER_URL must be set in .env}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:?Error: OIDC_AUDIENCE must be set in .env}"
      AUTH_ENABLED: "true"
      AUTH_REQUIRED: "true"
      DEV_AUTH_MODE: "false"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      APP_VERSION: ${IMAGE_TAG:-sura-latest}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/surendiranj/cloudscope-frontend}:${IMAGE_TAG:-sura-latest}
    container_name: cloudscope-frontend
    networks:
      - cloudscope-public
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  cloudscope-internal:
    internal: true
  cloudscope-public:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  app_storage:
