name: CloudScope CD

on:
  workflow_run:
    workflows:
      - "CloudScope CI"
    branches:
      - "sura"
    types:
      - completed
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to deploy (defaults to sura)"
        required: true
        default: "sura"

concurrency:
  group: cloudscope-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
  actions: read

jobs:
  release:
    name: Build, Tag & Publish Release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')
    outputs:
      commit_sha: ${{ steps.resolve-commit.outputs.commit_sha }}
      selected_ref: ${{ steps.resolve-commit.outputs.selected_ref }}
      ci_run_id: ${{ steps.resolve-commit.outputs.ci_run_id }}
      ci_run_url: ${{ steps.resolve-commit.outputs.ci_run_url }}
      release_version: ${{ steps.determine-version.outputs.release_version }}
      release_tag: ${{ steps.determine-version.outputs.release_tag }}
      owner_lc: ${{ steps.image-tags.outputs.owner_lc }}
      backend_digest: ${{ steps.build-backend.outputs.digest }}
      frontend_digest: ${{ steps.build-frontend.outputs.digest }}
      release_url: ${{ steps.create-release.outputs.release_url }}
    steps:
      - name: Resolve Commit and Verify CI Success Gate
        id: resolve-commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("GITHUB_TOKEN", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "SurendiranBJ/CloudScope")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          git_ref = os.environ.get("INPUT_GIT_REF", "sura").strip()
          workflow_run_sha = os.environ.get("WORKFLOW_RUN_SHA", "").strip()
          workflow_run_branch = os.environ.get("WORKFLOW_RUN_BRANCH", "").strip()

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "cloudscope-cd-gate",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          # 1. Resolve exact commit SHA
          if event_name == "workflow_run":
              if not workflow_run_sha:
                  print("::error::Missing workflow_run head_sha")
                  sys.exit(1)
              resolved_sha = workflow_run_sha
              selected_ref = workflow_run_branch if workflow_run_branch else "sura"
              print(f"Trigger: workflow_run (CI completion on branch '{selected_ref}')")
          else:
              selected_ref = git_ref if git_ref else "sura"
              print(f"Trigger: workflow_dispatch (manual ref '{selected_ref}')")
              commit_url = f"https://api.github.com/repos/{repo}/commits/{selected_ref}"
              try:
                  commit_data = get_json(commit_url)
                  resolved_sha = commit_data.get("sha")
                  if not resolved_sha or len(resolved_sha) != 40:
                      raise ValueError(f"Invalid SHA resolved: {resolved_sha}")
              except Exception as e:
                  print(f"::error::Failed to resolve ref '{selected_ref}': {e}")
                  sys.exit(1)

          # 2. Verify CI Success Gate for exact SHA
          runs_url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={resolved_sha}"
          try:
              runs_data = get_json(runs_url)
              workflow_runs = runs_data.get("workflow_runs", [])
          except Exception as e:
              print(f"::error::Failed to query GitHub Actions runs for SHA {resolved_sha}: {e}")
              sys.exit(1)

          ci_runs = [r for r in workflow_runs if r.get("name") == "CloudScope CI"]

          if not ci_runs:
              print("==================================================")
              print(f"Selected ref:  {selected_ref}")
              print(f"Resolved SHA:  {resolved_sha}")
              print(f"CI run:        None found for exact SHA")
              print(f"CI conclusion: None")
              print("==================================================")
              print(f"::error::Deployment blocked: Selected commit has no successful CloudScope CI run.")
              sys.exit(1)

          ci_runs.sort(key=lambda r: r.get("created_at", ""), reverse=True)
          latest_run = ci_runs[0]
          run_id = latest_run.get("id")
          run_status = latest_run.get("status")
          run_conclusion = latest_run.get("conclusion")
          run_url = latest_run.get("html_url")

          print("==================================================")
          print(f"Selected ref:  {selected_ref}")
          print(f"Resolved SHA:  {resolved_sha}")
          print(f"CI run:        #{run_id} ({run_url})")
          print(f"CI conclusion: {run_conclusion}")
          print("==================================================")

          if run_status != "completed":
              print(f"::error::Deployment blocked: CloudScope CI run {run_id} is '{run_status}'. Waiting for CI to finish.")
              sys.exit(1)

          if run_conclusion != "success":
              print(f"::error::Deployment blocked: CloudScope CI run {run_id} concluded with '{run_conclusion}'. Only 'success' is permitted.")
              sys.exit(1)

          print(f"CI verification: PASSED (Run {run_id} succeeded)")

          # Write outputs
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as f:
                  f.write(f"COMMIT_SHA={resolved_sha}\n")
                  f.write(f"SELECTED_REF={selected_ref}\n")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"commit_sha={resolved_sha}\n")
                  f.write(f"selected_ref={selected_ref}\n")
                  f.write(f"ci_run_id={run_id}\n")
                  f.write(f"ci_run_url={run_url}\n")
          EOF

      - name: Determine Next Semantic Version & Tag
        id: determine-version
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import subprocess
          import re
          import sys
          import os

          # Query tags from remote origin repository URL (works before and after checkout)
          repo = os.environ.get("GITHUB_REPOSITORY", "SurendiranBJ/CloudScope")
          remote_url = f"https://github.com/{repo}.git"

          try:
              output = subprocess.check_output(
                  ["git", "ls-remote", "--tags", remote_url],
                  stderr=subprocess.DEVNULL
              ).decode("utf-8")
          except Exception as e:
              print(f"Warning: git ls-remote on URL failed ({e}), falling back to origin...")
              try:
                  output = subprocess.check_output(
                      ["git", "ls-remote", "--tags", "origin"],
                      stderr=subprocess.DEVNULL
                  ).decode("utf-8")
              except Exception as e2:
                  print(f"Warning: git ls-remote origin failed: {e2}")
                  output = ""

          semver_pattern = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)$")
          existing_tags = set()
          parsed_versions = []

          for line in output.strip().splitlines():
              if not line:
                  continue
              parts = line.split("\t")
              if len(parts) == 2:
                  ref = parts[1].strip()
                  if ref.startswith("refs/tags/"):
                      tag_name = ref[len("refs/tags/"):].replace("^{}", "")
                      existing_tags.add(tag_name)
                      match = semver_pattern.match(tag_name)
                      if match:
                          major, minor, patch = map(int, match.groups())
                          parsed_versions.append((major, minor, patch))

          print(f"Discovered {len(existing_tags)} total tags on origin ({len(parsed_versions)} valid semver tags).")

          if not parsed_versions:
              next_ver = (1, 0, 0)
              print("No existing semver release tags found. Initializing release at v1.0.0.")
          else:
              parsed_versions.sort(key=lambda t: (t[0], t[1], t[2]))
              latest_major, latest_minor, latest_patch = parsed_versions[-1]
              print(f"Highest existing semver release: v{latest_major}.{latest_minor}.{latest_patch}")
              next_ver = (latest_major, latest_minor, latest_patch + 1)

          next_version = f"{next_ver[0]}.{next_ver[1]}.{next_ver[2]}"
          next_tag = f"v{next_version}"

          # Duplicate protection / conflict avoidance
          while next_tag in existing_tags or next_version in existing_tags:
              print(f"Release tag {next_tag} already exists on remote! Incrementing patch...")
              next_ver = (next_ver[0], next_ver[1], next_ver[2] + 1)
              next_version = f"{next_ver[0]}.{next_ver[1]}.{next_ver[2]}"
              next_tag = f"v{next_version}"

          print("==================================================")
          print(f"Allocated Release Version: {next_version}")
          print(f"Allocated Release Tag:     {next_tag}")
          print("==================================================")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"release_version={next_version}\n")
                  f.write(f"release_tag={next_tag}\n")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as f:
                  f.write(f"RELEASE_VERSION={next_version}\n")
                  f.write(f"RELEASE_TAG={next_tag}\n")
          EOF

      - name: Record Release Plan in Workflow Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_REF: ${{ steps.resolve-commit.outputs.selected_ref }}
          COMMIT_SHA: ${{ steps.resolve-commit.outputs.commit_sha }}
          CI_RUN_ID: ${{ steps.resolve-commit.outputs.ci_run_id }}
          CI_RUN_URL: ${{ steps.resolve-commit.outputs.ci_run_url }}
          RELEASE_TAG: ${{ steps.determine-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.determine-version.outputs.release_version }}
        run: |
          python3 - << 'EOF'
          import os

          event_name = os.environ.get("EVENT_NAME", "")
          release_version = os.environ.get("RELEASE_VERSION", "")
          release_tag = os.environ.get("RELEASE_TAG", "")
          selected_ref = os.environ.get("SELECTED_REF", "")
          commit_sha = os.environ.get("COMMIT_SHA", "")
          ci_run_id = os.environ.get("CI_RUN_ID", "")
          ci_run_url = os.environ.get("CI_RUN_URL", "")

          plan_lines = [
              "### 🚀 CloudScope Open Source Release Pipeline",
              "| Property | Value |",
              "|---|---|",
              f"| **Event Trigger** | `{event_name}` |",
              f"| **Target Release Version** | `{release_version}` (`{release_tag}`) |",
              f"| **Selected Source Ref** | `{selected_ref}` |",
              f"| **Exact Commit SHA** | `{commit_sha}` |",
              f"| **CI Verification Gate** | [Run #{ci_run_id}]({ci_run_url}) (Passed) |",
          ]
          summary = "\n".join(plan_lines) + "\n"

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary)
          EOF

      - name: Checkout repository at exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-commit.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Registry Namespaces and Image Tags
        id: image-tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "owner_lc=${OWNER_LC}" >> $GITHUB_OUTPUT
          echo "Target Registry Namespace: ghcr.io/${OWNER_LC}"

      - name: Build and push Backend Image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.determine-version.outputs.release_version }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudscope-backend:${{ steps.determine-version.outputs.release_tag }}
            ghcr.io/${{ env.OWNER_LC }}/cloudscope-backend:${{ steps.resolve-commit.outputs.commit_sha }}
            ghcr.io/${{ env.OWNER_LC }}/cloudscope-backend:sura-latest
          labels: |
            org.opencontainers.image.title=CloudScope Backend
            org.opencontainers.image.description=CloudScope AWS IAM & Security Analysis Engine
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve-commit.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.determine-version.outputs.release_version }}
          cache-from: type=gha,scope=cloudscope-backend
          cache-to: type=gha,mode=max,scope=cloudscope-backend
          provenance: true
          sbom: true

      - name: Build and push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudscope-frontend:${{ steps.determine-version.outputs.release_tag }}
            ghcr.io/${{ env.OWNER_LC }}/cloudscope-frontend:${{ steps.resolve-commit.outputs.commit_sha }}
            ghcr.io/${{ env.OWNER_LC }}/cloudscope-frontend:sura-latest
          labels: |
            org.opencontainers.image.title=CloudScope Frontend
            org.opencontainers.image.description=CloudScope React Web UI and API Proxy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.resolve-commit.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.determine-version.outputs.release_version }}
          cache-from: type=gha,scope=cloudscope-frontend
          cache-to: type=gha,mode=max,scope=cloudscope-frontend
          provenance: true
          sbom: true

      - name: Verify Docker Image Publication
        run: |
          echo "=================================================="
          echo "Docker Image Publication Verified"
          echo "Backend Digest:  ${{ steps.build-backend.outputs.digest }}"
          echo "Frontend Digest: ${{ steps.build-frontend.outputs.digest }}"
          echo "=================================================="
          if [ -z "${{ steps.build-backend.outputs.digest }}" ] || [ -z "${{ steps.build-frontend.outputs.digest }}" ]; then
            echo "::error::Image digests missing after build-push-action!"
            exit 1
          fi

      - name: Create and Push Git Release Tag
        id: create-tag
        env:
          RELEASE_TAG: ${{ steps.determine-version.outputs.release_tag }}
          COMMIT_SHA: ${{ steps.resolve-commit.outputs.commit_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Creating annotated tag ${RELEASE_TAG} pointing to ${COMMIT_SHA}..."
          git tag -a "${RELEASE_TAG}" "${COMMIT_SHA}" -m "CloudScope release ${RELEASE_TAG}"
          echo "Pushing tag ${RELEASE_TAG} to origin..."
          git push origin "${RELEASE_TAG}" || git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${RELEASE_TAG}"

          RESOLVED_TAG_SHA=$(git rev-list -n 1 "${RELEASE_TAG}")
          echo "Verified tag ${RELEASE_TAG} -> ${RESOLVED_TAG_SHA}"
          if [ "${RESOLVED_TAG_SHA}" != "${COMMIT_SHA}" ]; then
            echo "::error::Tag target SHA (${RESOLVED_TAG_SHA}) does not match CI SHA (${COMMIT_SHA})!"
            exit 1
          fi

      - name: Create GitHub Release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.determine-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.determine-version.outputs.release_version }}
          COMMIT_SHA: ${{ steps.resolve-commit.outputs.commit_sha }}
          OWNER_LC: ${{ steps.image-tags.outputs.owner_lc }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          python3 - << 'EOF'
          import os
          import subprocess

          release_tag = os.environ["RELEASE_TAG"]
          release_version = os.environ["RELEASE_VERSION"]
          commit_sha = os.environ["COMMIT_SHA"]
          owner_lc = os.environ["OWNER_LC"]
          backend_digest = os.environ.get("BACKEND_DIGEST", "")
          frontend_digest = os.environ.get("FRONTEND_DIGEST", "")

          lines = [
              f"## CloudScope {release_tag}",
              "",
              "Official open-source release of CloudScope, automated from verified CI test runs on branch `sura`.",
              "",
              "### 🐳 Prebuilt Docker Images (GitHub Container Registry)",
              "Pull and deploy directly using Docker Compose without installing Python, Node.js, Redis, or Neo4j:",
              "",
              f"- **Backend:** `ghcr.io/{owner_lc}/cloudscope-backend:{release_tag}` *(Digest: `{backend_digest}`)*",
              f"- **Frontend:** `ghcr.io/{owner_lc}/cloudscope-frontend:{release_tag}` *(Digest: `{frontend_digest}`)*",
              "",
              "Additional immutable tags pointing to the identical image digest:",
              f"- `ghcr.io/{owner_lc}/cloudscope-backend:{commit_sha}`",
              f"- `ghcr.io/{owner_lc}/cloudscope-backend:sura-latest`",
              f"- `ghcr.io/{owner_lc}/cloudscope-frontend:{commit_sha}`",
              f"- `ghcr.io/{owner_lc}/cloudscope-frontend:sura-latest`",
              "",
              "### 🚀 Quick Start (Docker-Only Installation)",
              "```bash",
              "# 1. Clone the repository",
              "git clone https://github.com/SurendiranBJ/CloudScope.git",
              "cd CloudScope",
              "",
              "# 2. Configure environment template",
              "cp .env.example .env",
              "",
              "# 3. Pull and run this release",
              f"IMAGE_TAG={release_tag} docker compose -f compose.release.yaml pull",
              f"IMAGE_TAG={release_tag} docker compose -f compose.release.yaml up -d",
              "```",
              "",
              "Access the web UI at: **http://localhost**",
          ]
          body = "\n".join(lines) + "\n"

          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)

          print(f"Creating GitHub Release for {release_tag}...")
          cmd = [
              "gh", "release", "create", release_tag,
              "--target", commit_sha,
              "--title", f"CloudScope {release_tag}",
              "--notes-file", "release_body.md",
              "--generate-notes"
          ]
          subprocess.check_call(cmd)

          url = subprocess.check_output(
              ["gh", "release", "view", release_tag, "--json", "url", "-q", ".url"]
          ).decode("utf-8").strip()

          print(f"GitHub Release created: {url}")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"RELEASE_URL={url}\n")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"release_url={url}\n")
          EOF

      - name: Smoke Test Release Compose on Runner
        env:
          IMAGE_TAG: ${{ steps.determine-version.outputs.release_tag }}
          BACKEND_IMAGE: ghcr.io/${{ steps.image-tags.outputs.owner_lc }}/cloudscope-backend
          FRONTEND_IMAGE: ghcr.io/${{ steps.image-tags.outputs.owner_lc }}/cloudscope-frontend
        run: |
          echo "Validating release Compose configuration with IMAGE_TAG=${IMAGE_TAG}..."
          NEO4J_PASSWORD="smoketest_neo4j_password_123" \
          JWT_SECRET="smoketest_jwt_secret_must_be_32_chars_long!" \
          docker compose -f compose.release.yaml config > /dev/null
          echo "✅ compose.release.yaml config interpolation verified successfully!"

      - name: Print Final Release Summary
        if: always()
        env:
          RELEASE_TAG: ${{ steps.determine-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.determine-version.outputs.release_version }}
          COMMIT_SHA: ${{ steps.resolve-commit.outputs.commit_sha }}
          SELECTED_REF: ${{ steps.resolve-commit.outputs.selected_ref }}
          CI_RUN_ID: ${{ steps.resolve-commit.outputs.ci_run_id }}
          CI_RUN_URL: ${{ steps.resolve-commit.outputs.ci_run_url }}
          OWNER_LC: ${{ steps.image-tags.outputs.owner_lc }}
          BACKEND_DIGEST: ${{ steps.build-backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build-frontend.outputs.digest }}
          RELEASE_URL: ${{ steps.create-release.outputs.release_url }}
        run: |
          python3 - << 'EOF'
          import os

          release_tag = os.environ.get("RELEASE_TAG", "")
          release_version = os.environ.get("RELEASE_VERSION", "")
          commit_sha = os.environ.get("COMMIT_SHA", "")
          selected_ref = os.environ.get("SELECTED_REF", "")
          ci_run_id = os.environ.get("CI_RUN_ID", "")
          ci_run_url = os.environ.get("CI_RUN_URL", "")
          owner_lc = os.environ.get("OWNER_LC", "")
          backend_digest = os.environ.get("BACKEND_DIGEST", "")
          frontend_digest = os.environ.get("FRONTEND_DIGEST", "")
          release_url = os.environ.get("RELEASE_URL", "")

          print("==================================================")
          print("CloudScope Open Source Release Summary")
          print("--------------------------------------------------")
          print(f"Release Tag:       {release_tag}")
          print(f"Release Version:   {release_version}")
          print(f"Release Commit:    {commit_sha}")
          print(f"Source Ref:        {selected_ref}")
          print(f"CI Quality Gate:   {ci_run_url}")
          print(f"Backend Image:     ghcr.io/{owner_lc}/cloudscope-backend:{release_tag}")
          print(f"Backend Digest:    {backend_digest}")
          print(f"Frontend Image:    ghcr.io/{owner_lc}/cloudscope-frontend:{release_tag}")
          print(f"Frontend Digest:   {frontend_digest}")
          print(f"GitHub Release:    {release_url}")
          print("==================================================")

          summary_lines = [
              "### 📦 CloudScope Release Published Successfully!",
              "| Property | Value |",
              "|---|---|",
              f"| **Release Tag** | `{release_tag}` |",
              f"| **Release Version** | `{release_version}` |",
              f"| **Commit SHA** | `{commit_sha}` |",
              f"| **CI Quality Gate** | [CI Run #{ci_run_id}]({ci_run_url}) (Passed) |",
              f"| **Backend Image** | `ghcr.io/{owner_lc}/cloudscope-backend:{release_tag}` |",
              f"| **Frontend Image** | `ghcr.io/{owner_lc}/cloudscope-frontend:{release_tag}` |",
              f"| **GitHub Release** | [{release_tag} Release Details]({release_url}) |",
              "",
              "#### Quick Run Command",
              "```bash",
              f"IMAGE_TAG={release_tag} docker compose -f compose.release.yaml up -d",
              "```",
          ]
          summary_md = "\n".join(summary_lines) + "\n"

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as f:
                  f.write(summary_md)
          EOF
