# CloudScope Development Compose Configuration
# Supports local development and building from source:
#   docker compose -f compose.yaml up --build
#
# For production deployments from prebuilt images, use:
#   docker compose -f compose.release.yaml up -d

services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: cloudscope-neo4j
    networks:
      - cloudscope-internal
    ports:
      - "127.0.0.1:7474:7474" # Neo4j HTTP Console (localhost only)
      - "127.0.0.1:7687:7687" # Neo4j Bolt (localhost only)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD must be set in .env}"
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudscope-redis
    networks:
      - cloudscope-internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudscope-backend
    networks:
      cloudscope-internal:
      cloudscope-public:
        aliases:
          - cloudscope-backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - ${AWS_CREDENTIALS_DIR:-~/.aws}:/home/cloudscope/.aws:ro
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      SCAN_REGIONS: ${SCAN_REGIONS:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD must be set in .env}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/storage/cloudscope.db}
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET must be set in .env}"
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      DEV_AUTH_MODE: ${DEV_AUTH_MODE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      APP_VERSION: development
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudscope-frontend
    networks:
      - cloudscope-public
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  cloudscope-internal:
    internal: true
  cloudscope-public:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  app_storage:
