services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: identityscope-neo4j
    ports:
      - "7474:7474" # Neo4j HTTP Console
      - "7687:7687" # Neo4j Bolt Driver
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]

  redis:
    image: redis:7-alpine
    container_name: identityscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identityscope-backend
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - redis
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=identityscope-scanner
      - AWS_DEFAULT_REGION=ap-south-1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
